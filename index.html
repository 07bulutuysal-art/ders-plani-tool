<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planify - Study Planner</title>

<style>
body{
font-family: Arial, sans-serif;
background:#121212;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1e1e1e;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
}

input, button{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

button{
background:#1db954;
color:white;
font-weight:bold;
cursor:pointer;
}

.plan{
margin-top:15px;
text-align:left;
}

.logo{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:20px;
}

.logo-icon{
width:55px;
height:55px;
border-radius:16px;
background:linear-gradient(135deg,#00ffcc,#7d2ae8);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
box-shadow:0 0 25px rgba(125,42,232,0.6);
transition:0.3s;
}

.logo-icon:hover{
transform:scale(1.1) rotate(8deg);
box-shadow:0 0 35px rgba(0,255,204,0.9);
}

.logo-text{
font-size:38px;
font-weight:800;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
-webkit-background-clip:text;
color:transparent;
font-family:sans-serif;
}

.tagline{
text-align:center;
color:#aaa;
margin-bottom:30px;
}


</style>
</head>

<body>

<div class="container">
<div style="display:flex;align-items:center;gap:10px;justify-content:center;">

  <div class="logo">
  <div class="logo-icon">⚡</div>
  <div class="logo-text">Planify</div>
</div>
<p class="tagline">Akıllı ders çalışma planı oluşturucu</p>

<input type="text" id="subjects" placeholder="Dersleri virgülle yaz">

<input type="number" id="hours" placeholder="Günlük kaç saat?">

<button onclick="createPlan()">Plan Oluştur</button>

<div class="plan" id="plan"></div>
</div>

<script>
function createPlan(){

let subjects = document.getElementById("subjects").value.split(",");
let hours = document.getElementById("hours").value;

let days = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];

let planHTML = "";

for(let i=0;i<days.length;i++){

let lesson = subjects[i % subjects.length];

planHTML += days[i] + " → " + lesson + " (" + hours + " saat)<br>";
}

document.getElementById("plan").innerHTML = planHTML;
}
</script>

</body>
</html>
