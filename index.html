<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planify</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1a1a2e);
color:white;
}

/* LOGO */

.logo{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:40px;
}

.logo-icon{
width:60px;
height:60px;
border-radius:18px;
background:linear-gradient(135deg,#00ffcc,#7d2ae8);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
box-shadow:0 0 30px rgba(125,42,232,0.6);
transition:0.3s;
}

.logo-icon:hover{
transform:scale(1.1) rotate(8deg);
}

.logo-text{
font-size:40px;
font-weight:800;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
-webkit-background-clip:text;
color:transparent;
}

.tagline{
text-align:center;
color:#aaa;
margin-bottom:30px;
}

/* KART */

.container{
max-width:500px;
margin:30px auto;
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

/* INPUT */

input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:none;
outline:none;
font-size:16px;
}

/* BUTTON */

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* SONUÇ */

#program{
margin-top:20px;
text-align:left;
line-height:1.6;
}

</style>
</head>

<body>

<div class="logo">
<div class="logo-icon">⚡</div>
<div class="logo-text">Planify</div>
</div>

<p class="tagline">Akıllı ders çalışma planı oluşturucu</p>

<div class="container">

<h2>Ders Planı Oluştur</h2>

<input type="text" id="dersler" placeholder="Dersleri virgülle yaz">

<input type="number" id="saat" placeholder="Günlük kaç saat?">

<button onclick="planOlustur()">Plan Oluştur</button>

<div id="program"></div>

</div>

<script>

function planOlustur(){

let dersler = document.getElementById("dersler").value.split(",");
let saat = document.getElementById("saat").value;

let program = "<h3>Günlük Plan</h3>";

dersler.forEach(ders => {
program += "📚 " + ders + " → " + saat/dersler.length + " saat <br>";
});

document.getElementById("program").innerHTML = program;

}

</script>

</body>
</html>
