<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fdwe – AI Study Planner</title>
<link rel="icon" href="logo.png">

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1a1a2e);
color:white;
}
.logo{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin-top:40px;
}
.logo-img{
width:65px;
height:65px;
object-fit:contain;
}
.logo-text{
font-size:40px;
font-weight:800;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
-webkit-background-clip:text;
color:transparent;
}
.container{
max-width:500px;
margin:30px auto;
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}
input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;
}
button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}
#program{
margin-top:20px;
line-height:1.7;
}
</style>
</head>

<body>

<div class="logo">
<img src="logo.png" class="logo-img">
<div class="logo-text">fdwe</div>
</div>

<div class="container">

<h2>AI Ders Planı Oluştur</h2>

<input type="text" id="hedef" placeholder="Hedefin ne?">
<input type="text" id="dersler" placeholder="Dersleri virgülle yaz">
<input type="number" id="saat" placeholder="Günlük kaç saat?">

<button onclick="planOlustur()">AI Plan Oluştur</button>
<button onclick="premiumAlert()">Premium Özellik</button>

<div id="program"></div>

</div>

<script>
// Kullanıcı plan kaydetmek için LocalStorage kullanılıyor
function planOlustur(){
let hedef = document.getElementById("hedef").value;
let dersler = document.getElementById("dersler").value.split(",");
let saat = document.getElementById("saat").value;
if(!hedef || dersler.length===0 || !saat){
alert("Lütfen tüm alanları doldur!");
return;
}

let gorevler = ["Konu çalış","Test çöz","Tekrar yap","Video izle"];
let program = `<h3>🎯 Hedef: ${hedef}</h3><h3>🤖 AI Çalışma Planın:</h3>`;

dersler.forEach(ders=>{
let gorev = gorevler[Math.floor(Math.random()*gorevler.length)];
let sure = (saat/dersler.length).toFixed(1);
program += `📚 ${ders} → ${gorev} (${sure} saat)<br>`;
});

// Motivasyon
program += `<br>🔥 Motivasyon: ${hedef} hedefine ulaşmak için bugün attığın küçük adımlar yarının büyük başarısını oluşturacak. Odaklan, dikkatini dağıtan şeyleri kapat ve planına sadık kal. Sen bunu yapabilecek güce sahipsin.`;

// LocalStorage’a kaydet
localStorage.setItem("sonPlan",program);

document.getElementById("program").innerHTML=program;
}

// Sayfa açıldığında planı geri yükle
window.onload = function(){
let kayitli = localStorage.getItem("sonPlan");
if(kayitli){
document.getElementById("program").innerHTML = kayitli;
}
}

// Premium buton simülasyonu
function premiumAlert(){
alert("Premium Özellik: AI önerili detaylı plan ve ilerleme takibi yakında eklenecek! Satış için hazır.");
}

</script>

</body>
</html>
