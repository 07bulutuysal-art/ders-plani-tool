<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planify AI</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1a1a2e);
color:white;
}

.logo{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin-top:40px;
}

.logo-icon{
width:60px;
height:60px;
border-radius:18px;
background:linear-gradient(135deg,#00ffcc,#7d2ae8);
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

.logo-text{
font-size:40px;
font-weight:800;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
-webkit-background-clip:text;
color:transparent;
}

.container{
max-width:500px;
margin:30px auto;
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}

input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00ffcc,#7d2ae8);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

#program{
margin-top:20px;
line-height:1.6;
}

</style>
</head>

<body>

<div class="logo">
<div class="logo-icon">🤖</div>
<div class="logo-text">Planify AI</div>
</div>

<div class="container">

<h2>AI Ders Planı Oluştur</h2>

<input type="text" id="dersler" placeholder="Dersleri virgülle yaz">
<input type="number" id="saat" placeholder="Günlük kaç saat?">

<button onclick="planOlustur()">AI Plan Oluştur</button>

<div id="program"></div>

</div>

<script>

function planOlustur(){

let dersler = document.getElementById("dersler").value.split(",");
let saat = document.getElementById("saat").value;

let zorluk = ["Kolay tekrar","Test çöz","Konu çalış","Video izle"];
let program = "<h3>🤖 AI Önerisi:</h3>";

dersler.forEach((ders,i)=>{

let gorev = zorluk[Math.floor(Math.random()*zorluk.length)];
let sure = (saat/dersler.length).toFixed(1);

program += `
📚 ${ders} → ${gorev} (${sure} saat) <br>
`;

});

program += "<br>🔥 25 dk çalışma + 5 dk mola sistemi önerilir.";

document.getElementById("program").innerHTML = program;

}

</script>

</body>
</html>
